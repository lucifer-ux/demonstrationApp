<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Finance - More About You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #E9EBF0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #1D1D1F;
        }
        .mobile-screen {
            width: 402px;
            height: 800px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .main { flex: 1; overflow-y: auto; padding: 22px 18px 18px; }
        h1 { font-size: 22px; line-height: 28px; letter-spacing: -0.26px; margin-bottom: 8px; }
        .hint { color: #6E6E73; font-size: 15px; line-height: 20px; letter-spacing: -0.23px; margin-bottom: 22px; }
        .section { font-size: 17px; line-height: 22px; letter-spacing: -0.43px; font-weight: 590; margin-bottom: 10px; }
        .field { margin-bottom: 12px; }
        .input, .select {
            width: 100%;
            height: 54px;
            border: 1px solid #B2B2B7;
            border-radius: 14px;
            padding: 0 14px;
            font-size: 18px;
            outline: none;
            background: #fff;
        }
        .row { display: flex; gap: 10px; }
        .info {
            margin: 14px 0;
            background: #EAF3FF;
            color: #007AFF;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            line-height: 20px;
            letter-spacing: -0.23px;
        }
        .cta {
            width: 100%;
            border: none;
            height: 54px;
            border-radius: 16px;
            background: #E5E5EA;
            color: #B3B3BA;
            font-size: 18px;
            font-weight: 600;
        }
        .footer-actions {
            border-top: 1px solid #ECECEF;
            background: #FFFFFF;
            padding: 14px 18px 18px;
        }
        .apple-badge { display: flex; justify-content: center; padding: 14px 0 0; }
        .apple-pill { background: #F5F5F7; padding: 8px 20px; border-radius: 999px; font-size: 15px; }
        .error-text { color: #FF3B30; font-size: 12px; margin-top: 6px; min-height: 16px; }
        @media (max-width: 460px) {
            body { padding: 0; background: #fff; }
            .mobile-screen { border-radius: 0; box-shadow: none; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <main class="main">
            <h1>A bit more about you</h1>
            <p class="hint">This helps lenders personalise your EMI offers.</p>

            <div class="section">Personal</div>
            <div class="field">
                <select class="select">
                    <option value="">Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="row">
                <input id="dobInput" class="input" type="text" value="06/01/2023" placeholder="Date of Birth" />
                <input id="pincodeInput" class="input" type="text" value="560095" placeholder="Pincode" />
            </div>
            <div id="personalError" class="error-text"></div>

            <div class="section" style="margin-top:18px;">Income</div>
            <div class="field">
                <input class="input" type="number" placeholder="Monthly Income" />
            </div>
            <div class="field">
                <select id="employmentType" class="select">
                    <option value="">Employment Type</option>
                    <option>Salaried</option>
                    <option>Self Employed</option>
                    <option>Business Owner</option>
                </select>
            </div>
            <div id="incomeError" class="error-text"></div>

            <div class="info">Income details are only used for eligibility and shared with lenders selected by you.</div>
        </main>
        <div class="footer-actions">
            <button id="checkEligibilityBtn" class="cta" disabled>Check Eligibility</button>
            <div class="apple-badge"><span class="apple-pill">apple.com</span></div>
        </div>
    </div>
    <script>
        const genderSelect = document.querySelectorAll('.select')[0];
        const dobInput = document.getElementById('dobInput');
        const pincodeInput = document.getElementById('pincodeInput');
        const monthlyIncomeInput = document.querySelector('input[placeholder="Monthly Income"]');
        const employmentTypeSelect = document.getElementById('employmentType');
        const checkEligibilityBtn = document.getElementById('checkEligibilityBtn');
        const personalError = document.getElementById('personalError');
        const incomeError = document.getElementById('incomeError');

        pincodeInput.addEventListener('input', () => {
            pincodeInput.value = pincodeInput.value.replace(/[^0-9]/g, '').slice(0, 6);
        });

        function validateForm() {
            const genderValid = genderSelect.value.trim().length > 0;
            const dobValid = /^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[012])\/(19|20)\d\d$/.test(dobInput.value.trim());
            const pincodeValid = /^[0-9]{6}$/.test(pincodeInput.value.trim());
            const incomeValid = Number(monthlyIncomeInput.value.trim()) > 0;
            const employmentValid = employmentTypeSelect.value.trim().length > 0;

            personalError.textContent =
                !genderValid || !dobValid || !pincodeValid
                    ? 'Enter valid gender, DOB (DD/MM/YYYY), and 6-digit pincode'
                    : '';
            incomeError.textContent =
                !incomeValid || !employmentValid
                    ? 'Enter monthly income and select employment type'
                    : '';

            if (genderValid && dobValid && pincodeValid && incomeValid && employmentValid) {
                checkEligibilityBtn.disabled = false;
                checkEligibilityBtn.style.background = '#08f';
                checkEligibilityBtn.style.color = '#fff';
                checkEligibilityBtn.style.cursor = 'pointer';
            } else {
                checkEligibilityBtn.disabled = true;
                checkEligibilityBtn.style.background = '#E5E5EA';
                checkEligibilityBtn.style.color = '#B3B3BA';
                checkEligibilityBtn.style.cursor = 'default';
            }
        }

        genderSelect.addEventListener('change', validateForm);
        dobInput.addEventListener('input', validateForm);
        pincodeInput.addEventListener('input', validateForm);
        monthlyIncomeInput.addEventListener('input', validateForm);
        employmentTypeSelect.addEventListener('change', validateForm);

        checkEligibilityBtn.addEventListener('click', () => {
            if (checkEligibilityBtn.disabled) return;
            window.location.href = '/api/demonstration/fetching-lenders';
        });
    </script>
</body>
</html>
