<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Finance - Mandate Complete</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #e9ebf0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #1d1d1f;
        }
        .mobile-screen {
            width: 402px;
            height: 800px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .center-stage {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .rupee-badge {
            width: 180px;
            height: 180px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            margin-bottom: 28px;
            box-shadow: 0 12px 30px rgba(11, 143, 51, 0.18);
            overflow: hidden;
        }
        .rupee-badge img {
            width: 100%;
            height: auto;
            display: block;
        }
        .title {
            font-size: 22px;
            line-height: 28px;
            letter-spacing: -0.26px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .sub {
            max-width: 310px;
            font-size: 15px;
            line-height: 20px;
            letter-spacing: -0.23px;
            color: #8e8e93;
        }
        .bottom-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
        }
        .timer {
            font-size: 16px;
            line-height: 21px;
            letter-spacing: -0.31px;
            font-weight: 590;
        }
        .subtitle {
            font-size: 15px;
            line-height: 20px;
            letter-spacing: -0.23px;
            color: #8e8e93;
        }
        .brand {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }
        .brand img {
            width: 280px;
            max-width: 100%;
            height: auto;
            display: block;
        }
        .apple-badge {
            display: flex;
            justify-content: center;
            padding: 0 0 24px;
        }
        .apple-pill {
            background: #f5f5f7;
            padding: 8px 20px;
            border-radius: 16px;
            font-size: 15px;
            color: #1d1d1f;
            box-shadow: 0 2px 40px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 460px) {
            body { padding: 0; background: #ffffff; }
            .mobile-screen { border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="content">
            <div class="center-stage">
                <div class="rupee-badge">
                    <img src="/images/rupeeSymbol.png" alt="Mandate Complete">
                </div>
                <div class="title">Mandate Setup Complete</div>
                <div class="sub">Sign the agreement to complete your loan journey.</div>
            </div>
            <div class="bottom-panel">
                <div class="timer" id="timer">0:10</div>
                <div class="subtitle">Please don't close this window</div>
                <div class="brand">
                    <img src="/images/Juspay-Branding.png" alt="secured by Juspay">
                </div>
            </div>
        </div>
        <div class="apple-badge"><span class="apple-pill">apple.com</span></div>
    </div>
    <script>
        const timerEl = document.getElementById('timer');
        let remaining = 3;
        timerEl.textContent = '0:03';
        const timer = setInterval(() => {
            remaining -= 1;
            timerEl.textContent = `0:0${Math.max(remaining, 0)}`;
            if (remaining <= 0) {
                clearInterval(timer);
                window.location.href = '/preparing-agreement';
            }
        }, 1000);
    </script>
</body>
</html>
