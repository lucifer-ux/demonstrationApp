<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Finance - Verifying OTP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #E9EBF0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .mobile-screen {
            width: 402px;
            height: 800px;
            background: #EFEFEF;
            border-radius: 24px;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .loader-card {
            width: 100%;
            padding: 18px;
            text-align: center;
            background: rgba(255, 255, 255, 0.22);
        }
        .loader {
            width: 50px;
            aspect-ratio: 1;
            display: grid;
            border-radius: 50%;
            margin: 0 auto 12px;
            background:
                linear-gradient(0deg ,rgb(0 0 0/50%) 30%,#0000 0 70%,rgb(0 0 0/100%) 0) 50%/8% 100%,
                linear-gradient(90deg,rgb(0 0 0/25%) 30%,#0000 0 70%,rgb(0 0 0/75% ) 0) 50%/100% 8%;
            background-repeat: no-repeat;
            animation: l23 1s infinite steps(12);
        }
        .loader::before,
        .loader::after {
            content: "";
            grid-area: 1/1;
            border-radius: 50%;
            background: inherit;
            opacity: 0.915;
            transform: rotate(30deg);
        }
        .loader::after {
            opacity: 0.83;
            transform: rotate(60deg);
        }
        .label {
            font-size: 17px;
            line-height: 22px;
            letter-spacing: -0.43px;
            color: #1D1D1F;
        }
        .apple-badge {
            display: flex;
            justify-content: center;
            padding: 18px 0 30px;
        }
        .apple-pill {
            background-color: #F5F5F7;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 15px;
            color: #1D1D1F;
        }
        @keyframes l23 { 100% { transform: rotate(1turn); } }
        @media (max-width: 460px) {
            body { padding: 0; background: #EFEFEF; }
            .mobile-screen { border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body>
    <div class="mobile-screen">
        <div class="content">
            <div class="loader-card">
                <div class="loader"></div>
                <div class="label">Verifying OTP</div>
            </div>
        </div>
        <div class="apple-badge"><span class="apple-pill">apple.com</span></div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = '/otp-success';
        }, 3000);
    </script>
</body>
</html>
